<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shayan Gon Choudhury — Holo Card</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#05060f;
    --card:#0b0f24;
    --cyan:#38BDF8;
    --violet:#A78BFA;
    --pink:#F472B6;
    --mint:#34D399;
    --ink:#E6EAF5;
    --muted:#8891B0;
  }

  *{ box-sizing:border-box; }

  html,body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(ellipse at 20% 20%, rgba(56,189,248,0.10), transparent 55%),
      radial-gradient(ellipse at 80% 80%, rgba(244,114,182,0.10), transparent 55%),
      var(--bg);
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Inter', sans-serif;
    color:var(--ink);
    overflow:hidden;
  }

  .stage{
    perspective:1200px;
    width:min(92vw, 380px);
  }

  .card{
    position:relative;
    border-radius:20px;
    padding:2px;
    background:linear-gradient(135deg, rgba(56,189,248,.5), rgba(167,139,250,.5), rgba(244,114,182,.5));
    transform-style:preserve-3d;
    transition:transform .12s ease-out;
    box-shadow:0 30px 60px -20px rgba(0,0,0,.7);
    cursor:pointer;
  }

  .card-inner{
    position:relative;
    border-radius:18px;
    background:linear-gradient(160deg, #0d1230 0%, #0a0e22 60%, #090c1c 100%);
    padding:34px 30px 28px;
    overflow:hidden;
  }

  /* foil sheen that follows the cursor */
  .sheen{
    position:absolute;
    inset:0;
    border-radius:18px;
    pointer-events:none;
    opacity:0;
    transition:opacity .25s ease;
    background:conic-gradient(from 0deg at var(--mx,50%) var(--my,50%),
      rgba(56,189,248,.35), rgba(167,139,250,.35), rgba(244,114,182,.35),
      rgba(52,211,153,.35), rgba(56,189,248,.35));
    mix-blend-mode:screen;
    filter:blur(18px);
  }
  .card:hover .sheen{ opacity:.65; }

  .grain{
    position:absolute; inset:0;
    background-image:radial-gradient(rgba(255,255,255,.035) 1px, transparent 1px);
    background-size:3px 3px;
    pointer-events:none;
    border-radius:18px;
  }

  .eyebrow{
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    letter-spacing:.16em;
    color:var(--muted);
    text-transform:uppercase;
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:18px;
  }
  .dot{
    width:6px; height:6px; border-radius:50%;
    background:var(--mint);
    box-shadow:0 0 8px var(--mint);
  }

  h1{
    font-family:'Space Grotesk', sans-serif;
    font-weight:700;
    font-size:26px;
    line-height:1.15;
    margin:0 0 4px;
    background:linear-gradient(90deg, var(--cyan), var(--violet) 45%, var(--pink) 80%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }

  .role{
    font-size:13.5px;
    color:var(--muted);
    margin:0 0 22px;
  }

  .stack{
    display:flex;
    flex-wrap:wrap;
    gap:7px;
    margin-bottom:24px;
  }
  .chip{
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    padding:5px 10px;
    border-radius:999px;
    border:1px solid rgba(255,255,255,.10);
    background:rgba(255,255,255,.03);
    color:var(--ink);
  }

  .divider{
    height:1px;
    background:linear-gradient(90deg, transparent, rgba(255,255,255,.12), transparent);
    margin:0 0 20px;
  }

  .links{
    display:flex;
    gap:14px;
  }
  .links a{
    font-family:'JetBrains Mono', monospace;
    font-size:11.5px;
    color:var(--cyan);
    text-decoration:none;
    border-bottom:1px solid rgba(56,189,248,.35);
    padding-bottom:2px;
    transition:color .15s, border-color .15s;
  }
  .links a:hover{
    color:var(--pink);
    border-color:var(--pink);
  }

  .hint{
    margin-top:26px;
    text-align:center;
    font-family:'JetBrains Mono', monospace;
    font-size:10.5px;
    letter-spacing:.08em;
    color:#4b5273;
  }

  @media (prefers-reduced-motion: reduce){
    .card{ transition:none; }
  }
</style>
</head>
<body>

<div class="stage">
  <div class="card" id="card">
    <div class="card-inner">
      <div class="sheen" id="sheen"></div>
      <div class="grain"></div>

      <div class="eyebrow"><span class="dot"></span>ID · 2026 · ACTIVE</div>

      <h1>Shayan Gon<br/>Choudhury</h1>
      <p class="role">Frontend Developer · UI/UX Enthusiast · CS Student</p>

      <div class="stack">
        <span class="chip">React</span>
        <span class="chip">Next.js</span>
        <span class="chip">TypeScript</span>
        <span class="chip">Node.js</span>
        <span class="chip">Tailwind</span>
      </div>

      <div class="divider"></div>

      <div class="links">
        <a href="https://github.com/shayangonchoudhury-svg" target="_blank" rel="noopener">GitHub</a>
        <a href="mailto:shayangonchoudhuryskms@gmail.com">Email</a>
        <a href="https://linkedin.com/in/YOUR-LINKEDIN" target="_blank" rel="noopener">LinkedIn</a>
      </div>
    </div>
  </div>
  <p class="hint">move your cursor across the card</p>
</div>

<script>
  const card = document.getElementById('card');
  const sheen = document.getElementById('sheen');
  const stage = document.querySelector('.stage');

  function handleMove(e){
    const rect = card.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;
    const px = x / rect.width;
    const py = y / rect.height;

    const rotateY = (px - 0.5) * 18;
    const rotateX = (0.5 - py) * 18;

    card.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale(1.02)`;
    sheen.style.setProperty('--mx', `${px * 100}%`);
    sheen.style.setProperty('--my', `${py * 100}%`);
  }

  function reset(){
    card.style.transform = 'rotateX(0deg) rotateY(0deg) scale(1)';
  }

  stage.addEventListener('mousemove', handleMove);
  stage.addEventListener('mouseleave', reset);

  // basic touch support
  stage.addEventListener('touchmove', (e) => {
    const t = e.touches[0];
    handleMove({ clientX: t.clientX, clientY: t.clientY });
  }, { passive: true });
  stage.addEventListener('touchend', reset);
</script>

</body>
</html>
